name: Update data & deploy Pages

# 필요한 수동 설정: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 지정하는 것 하나뿐.
on:
  schedule:
    # 3시간마다 (UTC). 한국 장중(00~07 UTC)과 미국 장 마감 후를 모두 커버
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/data.json"]
  workflow_dispatch: {}

permissions:
  contents: write   # data.json 커밋
  pages: write      # Pages 배포
  id-token: write   # deploy-pages OIDC

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python scripts/fetch.py

      - name: Commit data.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push || echo "push failed (branch moved?); deploying fresh data anyway"
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html assets data companies.json topics.json .nojekyll _site/
          # __BUILD__ keeps local static serving working; the deployed HTML pins assets to this commit.
          sha="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${sha}/g" _site/index.html
          grep -q "assets/app.js?v=${sha}" _site/index.html
          grep -q "assets/style.css?v=${sha}" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
